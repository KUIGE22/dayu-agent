[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dayu-agent"
version = "0.1.4"
description = "大愚 Agent：每个投资者的助理分析师"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Leo Liu" }]
keywords = [
    "agent",
    "llm",
    "financial-analysis",
    "sec",
    "edgar",
    "xbrl",
    "buy-side",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: Chinese (Simplified)",
]

# 运行依赖：与 requirements.txt 的“生产依赖”段保持一致。
dependencies = [
    "requests>=2.32.2",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.3",
    "PyYAML>=6.0.2",
    # `trafilatura>=1.12.0` 已要求 `charset-normalizer>=3.2.0`；
    # `aiohttp 3.8.x` 仍把其限制在 `<3.0`，该组合不存在可解最小环境。
    "aiohttp>=3.9.0",
    "prompt_toolkit>=3.0.0",
    "fastapi>=0.115.0",
    "edgartools>=5.30.0",
    # 当前项目正式支持的 Docling 基线直接收敛到 2.90+，避免继续承诺
    # 已不打算维护的更低版本区间。
    "docling>=2.90.0,<3.0.0",
    "docling-core>=2.74.0,<3.0.0",
    # pandas 下界需与 docling / docling-core 当前依赖树保持一致，
    # 上界维持在当前 3.x 生态窗口内，避免把 4.x 误声明为支持范围。
    "pandas>=2.1.4,<4.0.0",
    "lxml>=5.2.2",
    "click>=8.1.0",
    "trafilatura>=1.12.0",
    "readability-lxml>=0.8.1",
    "markdownify>=0.13.1",
    "html2text>=2024.2.26",
    "tabulate>=0.9.0",
    # 投资平台 PostgreSQL 存储依赖（Slice 1.1）：
    # - SQLAlchemy 2.x 提供同步 ORM 与事务边界，上限锁在 2.x 生态窗口；
    # - psycopg 3 二进制包提供 PostgreSQL 16 驱动，不引入旧版 2.x 语义；
    # - Alembic 管理 dayu_platform 全新 schema 迁移。
    "SQLAlchemy>=2.0.51,<2.1.0",
    "psycopg[binary]>=3.3.4,<3.4.0",
    "alembic>=1.18.5,<1.19.0",
    # S3-compatible Fins blob repository（Slice 1.4）：
    # boto3 是唯一运行时 S3 client；MinIO server 只属于 integration 环境。
    "boto3>=1.34.0,<2.0.0",
    # durable queue wake-up（Slice 2.2）：
    # - redis 8.1.x 是唯一 redis-py 依赖 owner（Host 层经
    #   dayu.host.redis_wakeup 唯一 import）；固定 client 8.1.x +
    #   server 8.4 组合只使用向后兼容 RESP2（protocol=2），不启用
    #   RESP3 push、不装 hiredis；
    # - croniter 6.2.x 只在 ScheduleService cron calculator 使用，
    #   只接收/返回 naive local datetime，ZoneInfo round-trip 是唯一
    #   DST classifier。
    "redis>=8.1.0,<8.2.0",
    "croniter>=6.2.4,<6.3.0",
]

[project.optional-dependencies]
# 浏览器回退抓取：安装后需额外执行 `playwright install chromium`。
browser = [
    "playwright>=1.40.0",
    # 当前代码直接从包根导入 `Stealth`，该符号在 1.x 包根未稳定导出。
    "playwright-stealth>=2.0.3",
]
# Web UI（streamlit）能力，仅在启用 `dayu-web` 入口时安装。
# 上界锁在当前 1.x 生态窗口，避免把未来 2.x 误声明为支持范围。
web = [
    "streamlit>=1.49.0,<2.0.0",
]
# 测试与静态检查工具链。
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-timeout>=2.1.0",
    "requests-mock>=1.11.0",
]
dev = [
    "mypy>=1.5.0",
    "pyright>=1.1.0",
    "ruff>=0.0.290",
    "black>=23.7.0",
    # S3FileStore 的 typed stubs（Slice 1.4），与 boto3 运行时版本窗对齐。
    "boto3-stubs[s3]>=1.34.0,<2.0.0",
    "botocore-stubs>=1.34.0,<2.0.0",
    "mypy-boto3-s3>=1.34.0,<2.0.0",
    "types-s3transfer>=0.9.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/noho/dayu-agent"
Repository = "https://github.com/noho/dayu-agent"
Issues = "https://github.com/noho/dayu-agent/issues"

[project.scripts]
dayu-cli = "dayu.cli.main:main"
dayu-web = "dayu.web.__main__:main"
dayu-wechat = "dayu.wechat.main:main"
dayu-render = "dayu.render.render:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["dayu*"]
exclude = [
    "tests*",
    "utils*",
    "docs*",
    "workspace*",
    "ref*",
    "internel*",
]

[tool.setuptools.package-data]
# 随包分发的默认配置、prompts 模板等非 .py 资源。
"dayu.config" = [
    "*.json",
    "prompts/**/*.md",
    "prompts/**/*.json",
    "prompts/**/*.yaml",
]
"dayu.assets" = [
    "*.md",
    "research_templates/*.md",
    "research_templates/*.definition.json",
]
"dayu.render" = [
    "*.css",
    "*.html",
    "*.lua",
    "*.docx",
    "*.xlsx",
    "*.mmd",
]

[tool.pytest.ini_options]
# 具体 pytest 设置见 pytest.ini（保留为单一事实源）。
minversion = "7.4"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.black]
line-length = 120
target-version = ["py311"]
