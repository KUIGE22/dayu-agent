[alembic]
# 迁移脚本位置：位于投资平台存储包内，随包分发。
script_location = dayu/investment/storage/migrations

# 本文件不保存 DSN / credential。
# Alembic env 只从环境变量 DAYU_PLATFORM_POSTGRES_DSN 读取 bootstrap DSN，
# 并在执行任何 DDL 前完成 superuser admission 预检。

# 日志配置：关闭 SQL 参数/secret 回显（不注册 sqlalchemy.engine logger）。
[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
